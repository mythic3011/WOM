services:
  postgres:
    image: postgres:15-alpine
    container_name: orchestral_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-wom_booking}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./docker/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orchestral_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: orchestral_backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-wom_booking}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-in-production-12345678}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - orchestral_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orchestral_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://backend:3000/api}
      VITE_BACKEND_URL: http://backend:3000
    volumes:
      - ./frontend:/app
    command: sh -c "rm -rf node_modules package-lock.json && npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - orchestral_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: orchestral_pgadmin
    restart: unless-stopped
    user: root
    ports:
      - "${PHPPGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@wom.hk}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - ./docker/pgadmin-data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orchestral_network
    entrypoint: >
      /bin/sh -c "
      chown -R pgadmin:pgadmin /var/lib/pgadmin &&
      chmod -R 700 /var/lib/pgadmin &&
      /entrypoint.sh
      "

networks:
  orchestral_network:
    driver: bridge
